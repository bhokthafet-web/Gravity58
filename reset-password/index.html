<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=5" />
    <meta name="viewport" content="width=device-width" />
    <title>Reset G58 password</title>
    <link rel="stylesheet" href="/js/portal.css" />
    <script src="/js/config.js?v=23"></script>
    <script src="/js/g58-api.js?v=21"></script>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Set a new password</h1>
        <p id="instructions">Opening your secure password-reset session…</p>
        <input
          id="newPassword"
          type="password"
          minlength="8"
          placeholder="New password"
        /><input
          id="confirmPassword"
          type="password"
          minlength="8"
          placeholder="Confirm new password"
        /><button id="savePassword" disabled>Update password</button>
        <p id="resetMessage"></p>
        <a href="/">Return to G58 login</a>
      </section>
    </main>
    <script>
      const byId = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const userId = params.get("userId");
      const secret = params.get("secret");
      const token = params.get("token");
      function sessionReady() {
        const ready = Boolean((token || (userId && secret)) && window.Gravity58Ads?.configured);
        byId("savePassword").disabled = !ready;
        byId("instructions").textContent = ready
          ? "Enter and confirm your new password."
          : "This reset link is invalid or expired. Request a new link from Login → Forgot password.";
      }
      sessionReady();
      byId("savePassword").onclick = async () => {
        const password = byId("newPassword").value,
          confirm = byId("confirmPassword").value;
        if (password.length < 8)
          return (byId("resetMessage").textContent =
            "Password must contain at least 8 characters.");
        if (password !== confirm)
          return (byId("resetMessage").textContent = "Passwords do not match.");
        try {
          await Gravity58Ads.completeRecovery(userId, token || secret, password);
          byId("resetMessage").textContent = "Password updated successfully. You can now return and sign in.";
        } catch (error) {
          byId("resetMessage").textContent = error.message || "Could not update the password.";
        }
      };
    </script>
    <script src="/js/server-status.js?v=2"></script>
</body>
</html>
